<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#e0b13c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="تاج پارسی">
<meta name="description" content="بازی استراتژی شهرسازی و نبرد — قلعه بساز، ارتش تشکیل بده و تاج پادشاهی را به دست بیاور.">
<title>تاج پارسی — خشم پادشاهان</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
/* ============================================================
   تاج پارسی — Taj-e Parsi
   یک بازی استراتژی کامل، تک‌فایلی، بدون هیچ وابستگی خارجی
   ============================================================ */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{
  font-family:'Vazirmatn','IRANSans','Segoe UI',Tahoma,sans-serif;
  background:#0f0c1d;
  background-image:
    radial-gradient(circle at 20% 0%, rgba(224,177,60,.10), transparent 55%),
    radial-gradient(circle at 85% 100%, rgba(122,58,237,.16), transparent 55%),
    linear-gradient(180deg,rgba(22,18,40,.82) 0%,rgba(15,12,29,.94) 55%),
    url('bg-city.jpg');
  background-size:auto,auto,auto,cover;
  background-position:center top;
  background-attachment:fixed;
  color:#f3ecdc;
  user-select:none;
  -webkit-user-select:none;
  touch-action:manipulation;
  font-size:14px;
  line-height:1.6;
}
body.night{
  background-image:
    radial-gradient(circle at 20% 0%, rgba(90,120,255,.14), transparent 55%),
    radial-gradient(circle at 85% 100%, rgba(60,20,120,.20), transparent 55%),
    linear-gradient(180deg,#0a0a18 0%,#05050c 60%);
}
#app{height:100%;display:flex;flex-direction:column;max-width:520px;margin:0 auto;position:relative}

/* ---------- هدر / منابع ---------- */
header{
  padding:8px 12px 6px;
  padding-top:calc(8px + env(safe-area-inset-top));
  background:linear-gradient(180deg,rgba(38,28,12,.85),rgba(20,15,35,.6));
  border-bottom:1px solid rgba(224,177,60,.22);
  
  flex-shrink:0;
}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
.king{display:flex;align-items:center;gap:8px;min-width:0}
.king .crown{font-size:22px;filter:drop-shadow(0 0 6px rgba(224,177,60,.5))}
.king b{font-size:13px;color:#e0b13c;display:block;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px}
.king small{font-size:10px;color:#9a8fb5;display:block;line-height:1.2}
.hright{display:flex;align-items:center;gap:6px}
.clock{font-size:11px;padding:3px 8px;border-radius:20px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);white-space:nowrap}
.iconbtn{
  width:30px;height:30px;border-radius:9px;border:1px solid rgba(224,177,60,.25);
  background:rgba(224,177,60,.08);color:#e0b13c;font-size:14px;display:flex;
  align-items:center;justify-content:center;cursor:pointer;flex-shrink:0
}
.iconbtn:active{transform:scale(.92)}
.resbar{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.res{
  background:rgba(0,0,0,.32);border:1px solid rgba(255,255,255,.07);
  border-radius:9px;padding:3px 4px;text-align:center;position:relative;overflow:hidden
}
.res .ic{font-size:13px;line-height:1}
.res .v{font-size:12px;font-weight:700;color:#fff;line-height:1.3;font-variant-numeric:tabular-nums}
.res .r{font-size:9px;color:#6fd68a;line-height:1.1;font-variant-numeric:tabular-nums}
.res.flash{animation:flash .45s}
@keyframes flash{0%{background:rgba(111,214,138,.45)}100%{background:rgba(0,0,0,.32)}}

/* ---------- محتوا ---------- */
main{flex:1;overflow-y:auto;overflow-x:hidden;padding:10px 10px 90px;-webkit-overflow-scrolling:touch}
.view{display:none;animation:fadein .22s}
.view.on{display:block}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.secttl{
  font-size:12px;color:#e0b13c;font-weight:700;margin:14px 0 8px;
  display:flex;align-items:center;gap:7px;letter-spacing:.3px
}
.secttl:first-child{margin-top:2px}
.secttl::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,rgba(224,177,60,.35),transparent)}

/* ---------- کارت ساختمان ---------- */
.card{
  background:linear-gradient(160deg,rgba(255,255,255,.055),rgba(255,255,255,.02));
  border:1px solid rgba(255,255,255,.08);border-radius:13px;padding:10px;
  margin-bottom:8px;position:relative;overflow:hidden
}
.card.locked{opacity:.45}
.card.busy{border-color:rgba(224,177,60,.35)}
.chead{display:flex;align-items:center;gap:9px;margin-bottom:6px}
.cico{
  width:40px;height:40px;border-radius:11px;font-size:21px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at 35% 30%,rgba(224,177,60,.28),rgba(0,0,0,.35));
  border:1px solid rgba(224,177,60,.22)
}
.cname{flex:1;min-width:0}
.cname b{font-size:13px;display:block;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cname small{font-size:10px;color:#9a8fb5}
.lvl{
  font-size:10px;padding:2px 8px;border-radius:20px;font-weight:700;
  background:rgba(224,177,60,.14);border:1px solid rgba(224,177,60,.3);color:#e0b13c;white-space:nowrap
}
.stat{display:flex;justify-content:space-between;font-size:11px;color:#b8adc9;padding:1px 0}
.stat b{color:#f3ecdc;font-weight:600}
.stat .up{color:#6fd68a}
.cost{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0}
.cost span{
  font-size:10px;padding:2px 7px;border-radius:7px;background:rgba(0,0,0,.3);
  border:1px solid rgba(255,255,255,.07);font-variant-numeric:tabular-nums
}
.cost span.no{color:#ff7a7a;border-color:rgba(255,122,122,.3)}
.btn{
  width:100%;padding:9px;border-radius:10px;border:none;cursor:pointer;
  font-family:inherit;font-size:13px;font-weight:700;color:#1a1206;
  background:linear-gradient(180deg,#f2c95c,#d4a12e);
  box-shadow:0 2px 0 rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.35);
  transition:transform .08s
}
.btn:active{transform:translateY(2px);box-shadow:0 0 0 rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.35)}
.btn:disabled{background:linear-gradient(180deg,#4a4458,#38334a);color:#8a8296;box-shadow:none;cursor:not-allowed}
.btn.sec{background:linear-gradient(180deg,#4a4260,#352f48);color:#e8e2f2;box-shadow:0 2px 0 rgba(0,0,0,.3)}
.btn.sec:active{transform:translateY(2px)}
.btn.red{background:linear-gradient(180deg,#e0574f,#b53b34);color:#fff}
.btn.ghost{background:transparent;border:1px solid rgba(224,177,60,.3);color:#e0b13c;box-shadow:none}
.btn.sm{padding:6px 10px;font-size:11px;width:auto}
.pbar{height:6px;border-radius:4px;background:rgba(0,0,0,.45);overflow:hidden;margin:7px 0}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,#d4a12e,#f2c95c);border-radius:4px;transition:width .3s}
.pbar.mil i{background:linear-gradient(90deg,#c0453e,#e0705f)}
.tmr{font-size:10px;color:#e0b13c;text-align:center;font-variant-numeric:tabular-nums}

/* ---------- نوار پایین ---------- */
nav{
  position:absolute;bottom:0;left:0;right:0;
  display:grid;grid-template-columns:repeat(6,1fr);
  background:linear-gradient(0deg,rgba(12,9,22,.98),rgba(18,14,32,.94));
  border-top:1px solid rgba(224,177,60,.2);
  padding-bottom:env(safe-area-inset-bottom);z-index:20
}
nav button{
  background:none;border:none;color:#7d7490;padding:8px 2px 7px;cursor:pointer;
  font-family:inherit;font-size:9.5px;display:flex;flex-direction:column;align-items:center;gap:2px;
  position:relative;transition:color .15s
}
nav button i{font-style:normal;font-size:19px;line-height:1;filter:grayscale(.7);transition:filter .15s}
nav button.on{color:#e0b13c}
nav button.on i{filter:none;transform:scale(1.08)}
nav button .dot{
  position:absolute;top:5px;left:22%;width:7px;height:7px;border-radius:50%;
  background:#6fd68a;box-shadow:0 0 6px #6fd68a;display:none
}
nav button.alert .dot{display:block;background:#ff7a7a;box-shadow:0 0 6px #ff7a7a}

/* ---------- لیست واحدها / دشمنان ---------- */
.unit{
  display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:12px;
  background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.07);margin-bottom:6px
}
.unit .uic{font-size:24px;width:34px;text-align:center;flex-shrink:0}
.unit .uinfo{flex:1;min-width:0}
.unit .uinfo b{font-size:12px;display:block}
.unit .uinfo small{font-size:10px;color:#9a8fb5;font-variant-numeric:tabular-nums}
.unit .ucnt{
  font-size:13px;font-weight:700;color:#e0b13c;min-width:34px;text-align:center;
  font-variant-numeric:tabular-nums
}
.foe{
  padding:10px;border-radius:13px;margin-bottom:8px;
  background:linear-gradient(160deg,rgba(185,58,46,.10),rgba(255,255,255,.02));
  border:1px solid rgba(185,58,46,.22);position:relative
}
.foe.beaten{opacity:.5;border-color:rgba(111,214,138,.3);background:linear-gradient(160deg,rgba(111,214,138,.08),rgba(255,255,255,.02))}
.foe .fhead{display:flex;align-items:center;gap:9px;margin-bottom:5px}
.foe .fhead .uic{font-size:26px}
.foe .fhead b{font-size:13px;display:block}
.foe .fhead small{font-size:10px;color:#c9a3a0}
.pw{display:flex;align-items:center;gap:5px;font-size:11px;margin:4px 0}
.pw .bar{flex:1;height:5px;border-radius:3px;background:rgba(0,0,0,.4);overflow:hidden}
.pw .bar i{display:block;height:100%}
.mine .bar i{background:linear-gradient(90deg,#d4a12e,#f2c95c)}
.theirs .bar i{background:linear-gradient(90deg,#b53b34,#e0705f)}
.odds{font-size:10px;padding:2px 7px;border-radius:6px;font-weight:700}
.odds.good{background:rgba(111,214,138,.15);color:#6fd68a}
.odds.mid{background:rgba(224,177,60,.15);color:#e0b13c}
.odds.bad{background:rgba(255,122,122,.15);color:#ff7a7a}

/* ---------- مودال ---------- */
.ovl{
  position:fixed;inset:0;background:rgba(5,3,12,.82);
  display:none;align-items:flex-end;justify-content:center;z-index:50;padding:0
}
.ovl.on{display:flex;animation:fadein .18s}
.modal{
  width:100%;max-width:520px;max-height:86vh;overflow-y:auto;
  background:linear-gradient(180deg,#241d3a,#171229);
  border:1px solid rgba(224,177,60,.28);border-bottom:none;
  border-radius:20px 20px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom));
  animation:slideup .25s cubic-bezier(.2,.9,.3,1)
}
@keyframes slideup{from{transform:translateY(100%)}to{transform:none}}
.mhead{display:flex;align-items:center;gap:10px;margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid rgba(255,255,255,.08)}
.mhead .big{font-size:30px}
.mhead b{font-size:15px;color:#e0b13c;display:block}
.mhead small{font-size:11px;color:#9a8fb5}
.mhead .x{margin-right:auto}
.divider{height:1px;background:rgba(255,255,255,.08);margin:10px 0}

/* ---------- گزارش / لاگ ---------- */
#log{
  position:fixed;top:0;left:50%;transform:translateX(-50%);z-index:60;
  width:100%;max-width:520px;padding:8px 10px;pointer-events:none;
  display:flex;flex-direction:column;gap:5px;align-items:center
}
.toast{
  background:rgba(20,15,35,.95);border:1px solid rgba(224,177,60,.35);
  border-radius:11px;padding:7px 14px;font-size:12px;max-width:94%;text-align:center;
  box-shadow:0 6px 20px rgba(0,0,0,.5);animation:toastin .25s
}
.toast.bad{border-color:rgba(255,122,122,.5);color:#ffb3ae}
.toast.good{border-color:rgba(111,214,138,.5);color:#a8f0bb}
@keyframes toastin{from{opacity:0;transform:translateY(-14px) scale(.94)}to{opacity:1;transform:none}}

/* ---------- رویدادها ---------- */
.evt{
  display:flex;gap:8px;padding:7px 9px;border-radius:10px;margin-bottom:5px;
  background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);font-size:11px
}
.evt .ei{font-size:15px;flex-shrink:0}
.evt .et{flex:1;color:#c9c0d8}
.evt .ew{font-size:9px;color:#7d7490;white-space:nowrap;font-variant-numeric:tabular-nums}
.evt.raid{border-color:rgba(255,122,122,.25);background:rgba(185,58,46,.08)}
.evt.win{border-color:rgba(111,214,138,.25);background:rgba(111,214,138,.06)}

/* ---------- پیشرفت کلی ---------- */
.bigstat{
  display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:10px
}
.bs{
  background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);
  border-radius:11px;padding:8px 5px;text-align:center
}
.bs b{display:block;font-size:17px;color:#e0b13c;font-variant-numeric:tabular-nums}
.bs small{font-size:9.5px;color:#9a8fb5}
.kp{
  background:linear-gradient(135deg,rgba(224,177,60,.13),rgba(122,58,237,.10));
  border:1px solid rgba(224,177,60,.28);border-radius:14px;padding:12px;margin-bottom:10px
}
.kp h3{font-size:13px;color:#e0b13c;margin-bottom:4px}
.kp p{font-size:11px;color:#c9c0d8;line-height:1.7}
.achv{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:11px;border-bottom:1px solid rgba(255,255,255,.05)}
.achv.done{color:#e0b13c}
.achv.off{color:#5f5870}
.achv .ai{font-size:16px}
.tabs{display:flex;gap:5px;margin-bottom:10px;background:rgba(0,0,0,.25);padding:4px;border-radius:11px}
.tabs button{
  flex:1;padding:7px;border:none;border-radius:8px;background:none;color:#8a8296;
  font-family:inherit;font-size:11px;cursor:pointer;font-weight:600
}
.tabs button.on{background:rgba(224,177,60,.16);color:#e0b13c}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.hint{font-size:10.5px;color:#8a8296;line-height:1.7;padding:8px 10px;background:rgba(0,0,0,.22);border-radius:10px;border:1px solid rgba(255,255,255,.05);margin-bottom:8px}
.hint b{color:#e0b13c}
::-webkit-scrollbar{width:0;height:0}

/* ---------- نسخه ۲: نقشه، فرمانده، ماموریت، آنلاین ---------- */
.mapwrap{position:relative;border-radius:15px;overflow:hidden;border:1px solid rgba(224,177,60,.3);box-shadow:0 8px 28px rgba(0,0,0,.5);margin-bottom:10px}
.mapwrap canvas{display:block;width:100%;height:auto;touch-action:none}
.maphud{position:absolute;top:6px;right:6px;left:6px;display:flex;gap:5px;justify-content:space-between;pointer-events:none}
.maphud span{background:rgba(10,7,20,.72);border:1px solid rgba(224,177,60,.25);border-radius:8px;padding:3px 8px;font-size:9.5px;color:#e8d9a8;backdrop-filter:blur(3px)}
.marchbar{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:12px;background:rgba(224,177,60,.08);border:1px solid rgba(224,177,60,.25);margin-bottom:8px;font-size:11px}
.marchbar .pbar{flex:1;margin:0}
.cmd{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:13px;background:linear-gradient(160deg,rgba(122,58,237,.10),rgba(255,255,255,.03));border:1px solid rgba(122,58,237,.25);margin-bottom:7px}
.cmd .cico{width:44px;height:44px;border-radius:50%;font-size:24px;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 35% 30%,rgba(255,215,120,.35),rgba(0,0,0,.4));border:2px solid rgba(224,177,60,.4)}
.cmd .ci{flex:1;min-width:0}
.cmd .ci b{font-size:12.5px;display:block}
.cmd .ci small{font-size:10px;color:#b9a8e0}
.cmd .cl{font-size:11px;color:#e0b13c;font-weight:700;white-space:nowrap}
.quest{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:11px;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.07);margin-bottom:6px;font-size:11px}
.quest.done{opacity:.55}
.quest .qi{font-size:17px}
.quest .qt{flex:1}
.quest .qt b{display:block;font-size:11.5px}
.quest .qt small{color:#9a8fb5;font-size:10px}
.qbtn{padding:5px 10px;border-radius:8px;border:none;background:linear-gradient(180deg,#7ee2a0,#3fae68);color:#08130c;font-weight:700;font-family:inherit;font-size:10.5px;cursor:pointer;box-shadow:0 2px 0 rgba(0,0,0,.3)}
.qbtn:active{transform:translateY(1px)}
.chatbox{height:190px;overflow-y:auto;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.08);border-radius:11px;padding:7px;margin-bottom:6px}
.msg{font-size:11px;margin-bottom:5px;line-height:1.6;word-break:break-word}
.msg b{color:#e0b13c}
.msg.sys b{color:#8f7bd8}
.chatin{display:flex;gap:5px}
.chatin input{flex:1;padding:9px 11px;border-radius:10px;border:1px solid rgba(224,177,60,.25);background:rgba(0,0,0,.35);color:#fff;font-family:inherit;font-size:12px}
.online-badge{display:inline-block;font-size:9px;padding:2px 8px;border-radius:10px;margin-right:6px}
.online-badge.on{background:rgba(111,214,138,.15);color:#6fd68a;border:1px solid rgba(111,214,138,.35)}
.online-badge.off{background:rgba(255,122,122,.12);color:#ff9a94;border:1px solid rgba(255,122,122,.3)}
.lb{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:10px;margin-bottom:4px;font-size:11px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.05)}
.lb.me{border-color:rgba(224,177,60,.45);background:rgba(224,177,60,.1)}
.lb .rk{width:22px;text-align:center;font-weight:700;color:#8a8296}
.lb .rk.top{color:#e0b13c}
.lb .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb .pw{font-variant-numeric:tabular-nums;color:#c9c0d8}
.battlecanvas{width:100%;border-radius:12px;border:1px solid rgba(224,177,60,.25);background:#0a0714;display:block;margin-bottom:10px}

/* ---------- نسخه‌ی ۳ ---------- */
body{background-image:linear-gradient(180deg,rgba(15,12,29,.9),rgba(10,8,20,.97)),url('img/bg-load.jpg');background-size:auto,cover;background-position:center,center;background-attachment:fixed}
#loadScreen{position:fixed;inset:0;z-index:300;background:url('img/bg-load.jpg') center/cover;display:flex;align-items:center;justify-content:center}
#loadScreen::before{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,5,16,.35),rgba(8,5,16,.88))}
.lwrap{position:relative;width:82%;max-width:380px;text-align:center}
.llogo{font-size:64px;filter:drop-shadow(0 0 22px rgba(224,177,60,.8));animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.lname{font-size:26px;font-weight:800;color:#f2c95c;text-shadow:0 2px 14px rgba(0,0,0,.7);letter-spacing:1px}
.lsub{font-size:11px;color:#cbb8e8;margin:4px 0 18px}
.lbarwrap{height:12px;border-radius:8px;background:rgba(0,0,0,.55);border:1px solid rgba(224,177,60,.4);overflow:hidden;box-shadow:inset 0 2px 6px rgba(0,0,0,.6)}
#loadBar{height:100%;width:0%;background:linear-gradient(90deg,#8a5a12,#f2c95c,#fff2c0);border-radius:8px;transition:width .12s;box-shadow:0 0 12px rgba(242,201,92,.7)}
.lrow{display:flex;justify-content:space-between;font-size:11px;color:#e8d9a8;margin-top:7px}
#loginScreen{position:fixed;inset:0;z-index:290;background:url('img/bg-load.jpg') center/cover;display:none;align-items:center;justify-content:center}
#loginScreen::before{content:'';position:absolute;inset:0;background:rgba(8,5,16,.72)}
.lgpanel{position:relative;width:86%;max-width:360px;background:linear-gradient(180deg,rgba(30,22,52,.92),rgba(14,10,26,.94));border:1px solid rgba(224,177,60,.45);border-radius:20px;padding:22px 18px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.7)}

const FA = '۰۱۲۳۴۵۶۷۸۹';
const fa = (n) => { const st = String(n); const L = (typeof window !== 'undefined' && window.LANGX) ? window.LANGX.cur : 'fa'; if (L === 'en') return st; const M = (L === 'ar') ? '٠١٢٣٤٥٦٧٨٩' : FA; return st.replace(/\d/g, (d) => M[d]); };
function fmt(n) {
  n = Math.floor(n);
  if (n >= 1e9) return fa((n / 1e9).toFixed(n >= 1e10 ? 0 : 1)) + ' میلیارد';
  if (n >= 1e6) return fa((n / 1e6).toFixed(n >= 1e7 ? 0 : 1)) + ' میلیون';
  if (n >= 10000) return fa((n / 1000).toFixed(n >= 100000 ? 0 : 1)) + ' هزار';
  return fa(n);
}
function fmtT(s) {
  s = Math.max(0, Math.ceil(s));
  if (s < 60) return fa(s) + ' ثانیه';
  if (s < 3600) return fa(Math.floor(s / 60)) + ' دقیقه';
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60);
  if (h < 24) return fa(h) + ' ساعت و ' + fa(m) + ' دقیقه';
  return fa(Math.floor(h / 24)) + ' روز و ' + fa(h % 24) + ' ساعت';
}

/* ---------- تعریف ساختمان‌ها ---------- */

    if (!d || !d.lvl) return null;
    const base = freshState(d.name);
    // ادغام امن با ساختار پایه تا نسخه‌های قدیمی هم کار کنند
    for (const k in base) { if (d[k] === undefined) d[k] = base[k]; }
    for (const k in base.lvl) if (d.lvl[k] === undefined) d.lvl[k] = 0;
    for (const k in base.units) if (d.units[k] === undefined) d.units[k] = 0;
    for (const k in base.wounded) if (d.wounded[k] === undefined) d.wounded[k] = 0;
    for (const k in base.r) if (d.r[k] === undefined) d.r[k] = 0;
    for (const k in base.stats) if (d.stats[k] === undefined) d.stats[k] = 0;
    for (const k in base.cxp) if (d.cxp[k] === undefined) d.cxp[k] = 0;
    return d;
  } catch (e) { return null; }
}

/* ---------- صدا (WebAudio، بدون فایل خارجی) ---------- */
let AC = null;
function beep(f, dur, type, vol) {
  if (!S || !S.sound) return;
  try {
    if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === 'suspended') AC.resume();
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type || 'sine'; o.frequency.value = f;
    g.gain.value = 0; o.connect(g); g.connect(AC.destination);
    const t = AC.currentTime, v = vol || 0.07;
    g.gain.linearRampToValueAtTime(v, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.start(t); o.stop(t + dur + 0.02);
  } catch (e) {}
}
const sfx = {
  tap: () => beep(660, 0.06, 'triangle', 0.04),
  build: () => { beep(420, 0.09, 'square', 0.05); setTimeout(() => beep(620, 0.12, 'square', 0.05), 80); },
  done: () => { beep(560, 0.1, 'triangle', 0.06); setTimeout(() => beep(760, 0.1, 'triangle', 0.06), 90); setTimeout(() => beep(980, 0.16, 'triangle', 0.06), 180); },
  win: () => { [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => beep(f, 0.18, 'triangle', 0.07), i * 110)); },
  lose: () => { [400, 330, 260].forEach((f, i) => setTimeout(() => beep(f, 0.22, 'sawtooth', 0.05), i * 150)); },
  bad: () => beep(180, 0.14, 'sawtooth', 0.05),
  coin: () => { beep(1200, 0.05, 'square', 0.04); setTimeout(() => beep(1600, 0.07, 'square', 0.04), 50); }
};

/* ---------- محاسبات ---------- */
function resLevel(id) { return S.res[id] || 0; }
function marchMult() { return 1 - resLevel('march') * 0.05; }
function gearSum(k) { let t = 0; for (const g in (S.gear || {})) t += ((S.gear || {})[g][k] || 0); return t; }
function atkBonus() { return 1 + resLevel('atk') * 0.08 + (S.lvl.castle - 1) * 0.02 + cmdLvl(S, 'rostam') * 0.03 + gearSum('atk') * 0.01; }
function defBonus() { return 1 + resLevel('def') * 0.08 + cmdLvl(S, 'darius') * 0.03 + gearSum('def') * 0.01; }
function wallMult() { return 1 + S.lvl.wall * 0.5 + resLevel('wall') * 0.15; }
function healPct() { return Math.min(0.9, S.lvl.hospital * 0.12 + resLevel('med') * 0.06); }
function raidMult() { return 1 + resLevel('raid') * 0.10; }
function isNight() { const h = new Date().getHours(); return h >= 20 || h < 6; }
function nightMult() { return isNight() ? 1.2 : 1; }

function prod() {
  const nm = nightMult();
  const castleMul = 1 + (S.lvl.castle - 1) * 0.06;
  const p = { food: 0, wood: 0, stone: 0, gold: 0 };
  p.food = S.lvl.farm * 26 * (1 + resLevel('agri') * 0.12) * castleMul;
  p.wood = S.lvl.lumber * 22 * (1 + resLevel('log') * 0.12) * castleMul;
  p.stone = S.lvl.quarry * 18 * (1 + resLevel('mine') * 0.12) * castleMul;
  p.gold = S.lvl.mine * 9 * (1 + resLevel('mine') * 0.12) * castleMul + S.lvl.market * 5;
  for (const k in p) p[k] *= nm;
  return p;
}

function capFor() {
  const c = 1 + (S.lvl.castle - 1) * 0.30;
  return {
    food: Math.floor(6000 * c),
    wood: Math.floor(6000 * c),
    stone: Math.floor(4000 * c),
    gold: Math.floor(2500 * c)
  };
}

function popCap() { return 30 + S.lvl.house * 40 + S.lvl.castle * 10; }
function armyCount(s) { s = s || S; let t = 0; for (const k in U) t += (s.units[k] || 0); return t; }
function woundedCount() { let t = 0; for (const k in U) t += (S.wounded[k] || 0); return t; }

function canAfford(cost) { for (const k in cost) if ((S.r[k] || 0) < cost[k]) return false; return true; }
function pay(cost) { for (const k in cost) S.r[k] -= cost[k]; }
function gain(o) {
  const cap = capFor();
  for (const k in o) {
    S.r[k] = Math.min(cap[k], (S.r[k] || 0) + o[k]);
    if (k === 'gold') S.stats.goldEarned += o[k];
  }
}

function buildCost(id) {
  const b = B[id], l = S.lvl[id] || 0, c = {};
  for (const k in b.base) c[k] = Math.ceil(b.base[k] * Math.pow(b.g, l));
  return c;
}
function buildTime(id) {
  const b = B[id], l = S.lvl[id] || 0;
  return Math.ceil(b.t * Math.pow(1.20, l) * marchMult());
}
function resCost(id) { return R[id].cost(resLevel(id)); }
function resTime(id) { return Math.ceil((25 + resLevel(id) * 14) * marchMult()); }
function trainTime(id) { return Math.ceil(U[id].t * marchMult()); }

function armyPower(units, atkMul, defMul) {
  let p = 0;
  for (const k in U) {
    const n = units[k] || 0;
    if (!n) continue;
    p += n * (U[k].atk * atkMul + U[k].def * defMul + U[k].hp * 0.12);
  }
  return Math.round(p);
}
function myPower() { return armyPower(S.units, atkBonus(), defBonus()); }
function foePower(f) { return armyPower(f.army, 1 + (f.lv - 1) * 0.07, 1 + (f.lv - 1) * 0.06); }

/* ---------- گزارش ---------- */
function toast(msg, type) {
  const box = $('#log');
  const t = el('div', 'toast' + (type ? ' ' + type : ''), msg);
  box.appendChild(t);
  setTimeout(() => { t.style.transition = 'opacity .3s, transform .3s'; t.style.opacity = '0'; t.style.transform = 'translateY(-10px)'; }, 2400);
  setTimeout(() => t.remove(), 2800);
}
function addEvent(icon, text, kind) {
  S.events.unshift({ i: icon, t: text, ts: Date.now(), k: kind || '' });
  if (S.events.length > 40) S.events.pop();
}

/* ==========================================================================
   حلقه‌ی اصلی بازی
   ========================================================================== */
function tick(dt) {
  S.stats.played += dt;
  tickMarch(dt);
  const p = prod();
  const cap = capFor();
  for (const k in p) S.r[k] = Math.min(cap[k], (S.r[k] || 0) + p[k] * dt);

  // ساخت‌وساز
  if (S.build) {
    S.build.done += dt;
    if (S.build.done >= S.build.total) {
      const id = S.build.id;
      S.lvl[id] = (S.lvl[id] || 0) + 1;
      S.stats.builds++;
      addEvent(B[id].i, B[id].n + ' به سطح ' + fa(S.lvl[id]) + ' رسید', 'win');
      toast(B[id].i + ' ' + B[id].n + ' کامل شد — سطح ' + fa(S.lvl[id]), 'good');
      sfx.done();
      S.build = null;
      checkAch();
    }
  }
  // آموزش سرباز
  if (S.train) {
    S.train.done += dt;
    if (S.train.done >= S.train.total) {
      const n = S.train.n, id = S.train.id;
      const space = popCap() - armyCount() - woundedCount();
      const add = Math.min(n, Math.max(0, space));
      S.units[id] = (S.units[id] || 0) + add;
      if (add < n) toast('⚠️ جا نبود؛ ' + fa(n - add) + ' سرباز در خانه ماندند', 'bad');
      addEvent(U[id].i, fa(add) + ' ' + U[id].n + ' به ارتش پیوستند', 'win');
      sfx.done();
      S.train = null;
      checkAch();
    }
  }
  // درمان
  if (S.heal) {
    S.heal.done += dt;
    if (S.heal.done >= S.heal.total) {
      const n = S.heal.n, id = S.heal.id;
      S.wounded[id] = Math.max(0, (S.wounded[id] || 0) - n);
      S.units[id] = (S.units[id] || 0) + n;
      toast('🏥 ' + fa(n) + ' ' + U[id].n + ' درمان شدند', 'good');
      sfx.done();
      S.heal = null;
    }
  }
  // تحقیق
  if (S.research) {
    S.research.done += dt;
    if (S.research.done >= S.research.total) {
      const id = S.research.id;
      S.res[id] = resLevel(id) + 1;
      addEvent(R[id].i, 'تحقیق «' + R[id].n + '» سطح ' + fa(S.res[id]), 'win');
      toast('📜 ' + R[id].n + ' کامل شد — سطح ' + fa(S.res[id]), 'good');
      sfx.done();
      S.research = null;
      checkAch();
    }
  }
}

function statRow(a, b) { return '<div class="stat"><span>' + a + '</span><b>' + b + '</b></div>'; }

/* ==========================================================================
   نبرد
   ========================================================================== */
function simulate(myUnits, foe, defending) {
  const mAtk = atkBonus(), mDef = defBonus() * (defending ? wallMult() : 1);
  const fAtk = 1 + (foe.lv - 1) * 0.07, fDef = 1 + (foe.lv - 1) * 0.06;
  let my = {}, their = {};
  for (const k in U) my[k] = myUnits[k] || 0;
  for (const k in U) their[k] = foe.army[k] || 0;

  const mp = armyPower(my, mAtk, mDef);
  const fp = armyPower(their, fAtk, fDef);
  const ratio = mp / Math.max(1, fp);
  // تلفات: برنده کم، بازنده زیاد
  const myLossRate = clamp(0.62 / Math.pow(ratio, 0.85), 0.03, 0.92);
  const fLossRate = clamp(0.62 * Math.pow(ratio, 0.85), 0.05, 1.0);
  // تصادفی‌سازی جزئی
  const jitter = 0.88 + Math.random() * 0.24;

  const losses = {}, foeLosses = {};
  let myLost = 0, fLost = 0;
  for (const k in U) {
    const c = Math.round((my[k] || 0) * clamp(myLossRate * jitter, 0, 1));
    losses[k] = Math.min(my[k] || 0, c);
    myLost += losses[k];
    const fc = Math.round((their[k] || 0) * clamp(fLossRate / jitter, 0, 1));
    foeLosses[k] = Math.min(their[k] || 0, fc);
    fLost += foeLosses[k];
  }
  const win = mp * jitter > fp;
  return { win, mp, fp, ratio, losses, foeLosses, myLost, fLost, my, their };
}

function applyMyLosses(losses) {
  const hp = healPct();
  let saved = 0;
  for (const k in U) {
    const l = losses[k] || 0;
    if (!l) continue;
    S.units[k] = Math.max(0, (S.units[k] || 0) - l);
    const s = Math.floor(l * hp);
    if (s > 0) { S.wounded[k] = (S.wounded[k] || 0) + s; saved += s; }
  }
  return saved;
}

function attackFoe(idx) {
  const f = FOES[idx];
  if (armyCount() < 1) { toast('🚫 هیچ سربازی نداری!', 'bad'); sfx.bad(); return; }
  const r = simulate(S.units, f, false);
  const saved = applyMyLosses(r.losses);

  if (r.win) {
    if (!S.beaten[idx]) { S.beaten[idx] = true; S.stats.wins++; }
    const rew = {};
    for (const k in f.rew) rew[k] = Math.ceil(f.rew[k] * raidMult());
    gain(rew);
    S.stats.kills = (S.stats.kills || 0) + r.fLost;
    dropGear(f.lv);
    sfx.win();
    addEvent('🏆', 'فتح «' + f.n + '» — ' + fa(r.fLost) + ' دشمن نابود شد', 'win');
    S.stats.raids++;
    checkAch();
    showBattle(f, r, rew, saved);
  } else {
    S.stats.losses++;
    sfx.lose();
    addEvent('💀', 'شکست در «' + f.n + '» — ' + fa(r.myLost) + ' سرباز از دست رفت', 'raid');
    showBattle(f, r, null, saved);
  }
  save();
  render();
}

function showBattle(f, r, rew, saved) {
  let h = '<canvas id="batCv" class="battlecanvas" width="440" height="150"></canvas>' +
    '<div class="kp"><h3>' + (r.win ? '🏆 پیروزی!' : '💀 شکست') + '</h3>' +

    '<div class="pw mine"><span>👑 ' + fmt(r.mp) + '</span><div class="bar"><i style="width:' + Math.round(clamp(r.mp / (r.mp + r.fp) * 100, 3, 97)) + '%"></i></div></div>' +
    '<div class="pw theirs"><span>' + f.i + ' ' + fmt(r.fp) + '</span><div class="bar"><i style="width:' + Math.round(clamp(r.fp / (r.mp + r.fp) * 100, 3, 97)) + '%"></i></div></div>' +
    '<div class="divider"></div>' +

  if (r.win && rew) {

    h += '<div class="divider"></div>';
  }
  h += '<div class="secttl">💀 تلفات</div>' +

    statRow('دشمنان نابودشده', fa(r.fLost));

  modal(r.win ? '🏆' : '💀', r.win ? 'پیروزی در ' + f.n : 'شکست در ' + f.n, h, [{ t: 'باشه', act: closeModal }]);
  setTimeout(() => { const c = $('#batCv'); if (c) battleAnim(c, r.win); }, 60);
}
const RN = { food: 'غذا', wood: 'چوب', stone: 'سنگ', gold: 'طلا' };
const RI = { food: '🌾', wood: '🪵', stone: '🪨', gold: '🪙' };

/* ---------- حمله‌ی دشمن ---------- */
function enemyRaid() {
  if (S.lvl.castle < 2 || armyCount() < 1) return;
  const tier = clamp(Math.floor(S.lvl.castle / 3), 0, FOES.length - 2);
  const base = FOES[Math.max(0, tier - 1)];
  const f = { n: 'غارتگران ' + base.n, i: '⚡', lv: Math.max(1, base.lv - 1), army: {} };
  const scale = 0.35 + Math.random() * 0.35;
  for (const k in base.army) f.army[k] = Math.max(1, Math.round(base.army[k] * scale));

  const r = simulate(S.units, f, true);
  const saved = applyMyLosses(r.losses);

  if (r.win) {
    S.stats.defends++;
    sfx.win();
    addEvent('🛡️', 'حمله‌ی «' + f.n + '» دفع شد! ' + fa(r.fLost) + ' مهاجم کشته شد', 'win');
    toast('🛡️ حمله‌ی دشمن را دفع کردی!', 'good');
    checkAch();
  } else {
    const lost = {};
    const cap = capFor();
    const steal = 0.06 + Math.random() * 0.06;
    for (const k in S.r) {
      const a = Math.floor(S.r[k] * steal);
      if (a > 0) { lost[k] = a; S.r[k] -= a; }
    }
    sfx.lose();
    let t = '⚡ دشمن حمله کرد و شکست خوردی! ' + fa(r.myLost) + ' سرباز از دست رفت';
    if (lost.gold) t += ' · ' + fmt(lost.gold) + ' طلا غارت شد';
    addEvent('⚡', t, 'raid');
    toast(t, 'bad');
  }
  save();
  render();
}

function buildCard(id) {
  const b = B[id], lv = S.lvl[id] || 0;
  const castle = S.lvl.castle;
  let locked = false, lockMsg = '';

  if (id !== 'castle' && lv + 1 > castle) { locked = true; lockMsg = 'قصر باید سطح ' + fa(lv + 1) + ' باشد'; }
  if (id === 'quarry' && castle < 2) { locked = true; lockMsg = 'قصر سطح ۲ لازم است'; }
  if (id === 'mine' && castle < 5) { locked = true; lockMsg = 'قصر سطح ۵ لازم است'; }
  if (id === 'barracks' && castle < 2) { locked = true; lockMsg = 'قصر سطح ۲ لازم است'; }
  if (id === 'range' && S.lvl.barracks < 3) { locked = true; lockMsg = 'سربازخانه سطح ۳ لازم است'; }
  if (id === 'stable' && S.lvl.barracks < 5) { locked = true; lockMsg = 'سربازخانه سطح ۵ لازم است'; }
  if (id === 'library' && castle < 4) { locked = true; lockMsg = 'قصر سطح ۴ لازم است'; }
  if (id === 'market' && castle < 3) { locked = true; lockMsg = 'قصر سطح ۳ لازم است'; }
  if (b.max && lv >= b.max) { locked = true; lockMsg = 'حداکثر سطح'; }
  if (id === 'castle' && lv >= b.cap) { locked = true; lockMsg = 'حداکثر سطح'; }

  const cost = buildCost(id);
  const afford = canAfford(cost);
  const busy = !!S.build;

  const c = el('div', 'card' + (locked ? ' locked' : ''));
  let h = '<div class="chead"><div class="cico">' + b.i + '</div>' +
    '<div class="cname"><b>' + b.n + '</b><small>' + b.d + '</small></div>' +
    '<span class="lvl">' + (lv > 0 ? 'سطح ' + fa(lv) : 'ساخته نشده') + '</span></div>';

  // آمار فعلی / بعدی
  h += '<div class="stat"><span>وضعیت فعلی</span><b>' + buildingStat(id, lv) + '</b></div>';
  if (!locked || (b.max && lv < b.max)) h += '<div class="stat"><span>در سطح بعدی</span><b class="up">' + buildingStat(id, lv + 1) + '</b></div>';

  if (locked) {
    h += '<div class="hint" style="margin-top:7px">🔒 ' + lockMsg + '</div>';
  } else {
    h += '<div class="cost">' + costHTML(cost) + '</div>' +
      '<button class="btn"' + (!afford || busy ? ' disabled' : '') + ' data-act="build" data-id="' + id + '">' +
      (lv === 0 ? '🏗️ ساختن' : '⬆️ ارتقا به سطح ' + fa(lv + 1)) + ' · ' + fmtT(buildTime(id)) + '</button>';
    if (busy) h += '<div class="hint" style="margin-top:6px">⏳ تا پایان ساخت فعلی صبر کن</div>';
  }
  c.innerHTML = h;
  return c;
}

function buildingStat(id, lv) {
  if (lv <= 0) return '—';
  const castleMul = 1 + (S.lvl.castle - 1) * 0.06;
  switch (id) {
    case 'farm': return '🌾 +' + fa(Math.round(lv * 26 * (1 + resLevel('agri') * .12) * castleMul)) + ' در ثانیه';
    case 'lumber': return '🪵 +' + fa(Math.round(lv * 22 * (1 + resLevel('log') * .12) * castleMul)) + ' در ثانیه';
    case 'quarry': return '🪨 +' + fa(Math.round(lv * 18 * (1 + resLevel('mine') * .12) * castleMul)) + ' در ثانیه';
    case 'mine': return '🪙 +' + fa(Math.round(lv * 9 * (1 + resLevel('mine') * .12) * castleMul)) + ' در ثانیه';
    case 'house': return '👥 ظرفیت ' + fa(30 + lv * 40 + S.lvl.castle * 10) + ' سرباز';
    case 'castle': return '🏰 سقف سطح ساختمان‌ها: ' + fa(lv);
    case 'wall': return '🛡️ قدرت دفاع ×' + (1 + lv * 0.5 + resLevel('wall') * .15).toFixed(2);
    case 'hospital': return '🏥 نجات ' + fa(Math.round(Math.min(90, lv * 12 + resLevel('med') * 6))) + '٪ تلفات';
    case 'market': return '🪙 +' + fa(lv * 5) + ' طلا در ثانیه';
    case 'barracks': return '🎖️ سطح ' + fa(lv) + ' · واحدهای بهتر باز می‌شود';
    case 'range': return '🏹 سطح ' + fa(lv) + ' · کماندار قوی‌تر';
    case 'stable': return '🐎 سطح ' + fa(lv) + ' · شوالیه قوی‌تر';
    case 'library': return '📚 سطح ' + fa(lv) + ' · تحقیق‌های بهتر';
  }
  return '';
}

function costHTML(cost) {
  let h = '';
  for (const k in cost) {
    const no = (S.r[k] || 0) < cost[k];
    h += '<span class="' + (no ? 'no' : '') + '">' + RI[k] + ' ' + fmt(cost[k]) + '</span>';
  }
  return h;
}

function ago(ts) {
  const s = Math.floor((Date.now() - ts) / 1000);
  if (s < 60) return 'همین حالا';
  if (s < 3600) return fa(Math.floor(s / 60)) + ' د پیش';
  if (s < 86400) return fa(Math.floor(s / 3600)) + ' س پیش';
  return fa(Math.floor(s / 86400)) + ' روز پیش';
}

let lastView = null;
function render() {
  const preserve = lastView === VIEW;
  const m = $('#main');
  const sc = preserve && m ? m.scrollTop : 0;
  renderHeader();
  const qbar = $('#questbar');
  if (qbar) { const pq = QUESTS.find((q) => !S.q[q.id]); qbar.innerHTML = pq ? '📜 <b>' + pq.n + '</b> — ' + pq.d : '🏆 همه‌ی ماموریت‌ها انجام شد'; }
  if (VIEW === 'city') renderCity();
  else if (VIEW === 'army') renderArmy();
  else if (VIEW === 'camp') renderCampV2();
  else if (VIEW === 'net') renderNet();
  else if (VIEW === 'res') renderRes();
  else renderMore();
  if (m) m.scrollTop = sc;
  lastView = VIEW;
}
function go(v) {
  VIEW = v;
  document.querySelectorAll('.view').forEach((n) => n.classList.remove('on'));
  $('#v-' + v).classList.add('on');
  document.querySelectorAll('#nav button').forEach((b) => b.classList.toggle('on', b.dataset.v === v));
  render();
  stopMapLoop();
  sfx.tap();
}

function modal(icon, title, html, buttons) {
  const m = $('#modal');
  m.innerHTML = '<div class="mhead"><span class="big">' + icon + '</span><div style="flex:1"><b>' + title + '</b></div>' +
    '<button class="iconbtn x" data-act="close">✕</button></div><div id="mbody">' + html + '</div>';
  if (buttons && buttons.length) {
    const bw = el('div', 'row2');
    bw.style.marginTop = '12px';
    buttons.forEach((b) => {
      const btn = el('button', 'btn' + (b.sec ? ' sec' : ''), b.t);
      btn.onclick = () => { sfx.tap(); b.act(); };
      bw.appendChild(btn);

  $('#ovl').classList.add('on');
}
function closeModal() { $('#ovl').classList.remove('on'); }

/* ---------- تأیید ساخت ---------- */
function confirmBuild(id) {
  const b = B[id], lv = S.lvl[id] || 0, cost = buildCost(id), t = buildTime(id);
  let h = '<p style="font-size:12px;color:#c9c0d8;line-height:1.8">' + b.d + '</p><div class="divider"></div>' +
    statRow('سطح فعلی', lv > 0 ? fa(lv) : 'ساخته نشده') +
    statRow('سطح بعدی', fa(lv + 1)) +
    statRow('وضعیت فعلی', buildingStat(id, lv)) +
    statRow('بعد از ارتقا', buildingStat(id, lv + 1)) +
    '<div class="divider"></div><div class="secttl">💎 هزینه</div><div class="cost">' + costHTML(cost) + '</div>' +
    statRow('⏱️ زمان ساخت', fmtT(t));
  modal(b.i, (lv === 0 ? 'ساختن ' : 'ارتقای ') + b.n, h, [
    { t: 'بی‌خیال', sec: true, act: closeModal },
    { t: lv === 0 ? '🏗️ بساز' : '⬆️ ارتقا بده', act: () => { doBuild(id); closeModal(); } }
  ]);
}
function doBuild(id) {
  const cost = buildCost(id);
  if (S.build) { toast('⏳ اول صبر کن ساخت فعلی تمام شود', 'bad'); sfx.bad(); return; }
  if (!canAfford(cost)) { toast('🚫 منابع کافی نداری', 'bad'); sfx.bad(); return; }
  pay(cost);
  S.build = { id: id, to: (S.lvl[id] || 0) + 1, total: buildTime(id), done: 0 };
  addEvent('🏗️', 'ساخت «' + B[id].n + '» آغاز شد', '');
  sfx.build();
  save(); render();
}

}
function doTrain(id, n) {
  if (S.train) { toast('⏳ اول آموزش فعلی تمام شود', 'bad'); sfx.bad(); return; }
  const u = U[id];
  const per = {};
  for (const k in u.cost) per[k] = Math.ceil(u.cost[k] * (1 + (S.lvl.castle - 1) * 0.02));
  const cost = {};
  for (const k in per) cost[k] = per[k] * n;
  if (!canAfford(cost)) { toast('🚫 منابع کافی نداری', 'bad'); sfx.bad(); return; }
  if (armyCount() + woundedCount() >= popCap()) { toast('🚫 ظرفیت جمعیت پر است', 'bad'); sfx.bad(); return; }
  pay(cost);
  S.train = { id: id, n: n, total: trainTime(id) * n, done: 0 };
  addEvent(u.i, 'آموزش ' + fa(n) + ' ' + u.n + ' آغاز شد', '');
  sfx.build();
  save(); render();
}

  }

  // ثبت سرویس‌ورکر برای بازی آفلاین

    navigator.serviceWorker.register('sw.js').catch(() => {});

}

const CMD = {

  darius: { n: 'داریوش',  i: '🛡️', d: 'دفاع ارتش +۳٪ در هر سطح', per: 3, max: 30 },

};
function cmdLvl(s, k) { return Math.min(CMD[k].max, Math.floor(Math.sqrt((s.cxp[k] || 0) / 40))); }
function gainXp(n) {
  for (const k in CMD) {

    S.cxp[k] = (S.cxp[k] || 0) + n;
    const a = cmdLvl(S, k);

  }
}

/* ==========================================================================
   نقشه‌ی جهان + مه + گره‌های منبع + هیولاها
   ========================================================================== */
function mulberry(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
let MAP = null;
function genMap() {
  const r = mulberry(20260829);
  MAP = { nodes: [], camps: [], ais: [] };
  const types = ['food', 'wood', 'stone', 'gold'];
  for (let i = 0; i < 18; i++) {
    const t = types[Math.floor(r() * 4)];
    MAP.nodes.push({ id: 'n' + i, t, x: 6 + r() * 88, y: 6 + r() * 88, amount: Math.floor(4000 + r() * 26000) });
  }
  for (let i = 0; i < 6; i++) {
    const lv = [2, 4, 7, 10, 14, 18][i];
    MAP.camps.push({ id: 'c' + i, lv, x: 8 + r() * 84, y: 8 + r() * 84, dead: false, army: campArmy(lv, r) });
  }
  for (let i = 0; i < 5; i++) MAP.ais.push({ id: 'a' + i, n: 'قلعه‌ی ' + ['ابر', 'خاکستر', 'یخ', 'طوفان', 'شب'][i], i: ['🏯', '🏰', '', '️', ''][i], lv: 3 + i * 3, x: 10 + r() * 80, y: 10 + r() * 80, army: campArmy(3 + i * 3, r) });
  MAP.home = { x: 50, y: 56 };
}
function campArmy(lv, r) {
  r = r || Math.random;
  const a = {};
  const n = Math.round(8 + lv * 6);
  a.militia = Math.round(n * 0.5);
  if (lv >= 3) a.spear = Math.round(n * 0.25);
  if (lv >= 6) a.archer = Math.round(n * 0.2);
  if (lv >= 9) a.sword = Math.round(n * 0.2);
  if (lv >= 12) a.knight = Math.round(n * 0.12);
  return a;
}
function revealR() { return 20 + S.lvl.castle * 2.2; }
function isRevealed(x, y) {
  const d = Math.hypot(x - MAP.home.x, y - MAP.home.y);
  if (d <= revealR()) return true;
  for (const e of (S.explored || [])) if (Math.hypot(x - e[0], y - e[1]) < 12) return true;
  return false;
}

/* ---------- حرکت (March) ---------- */
function marchTime(x, y) {
  const d = Math.hypot(x - MAP.home.x, y - MAP.home.y);
  return Math.max(4, Math.ceil(d * 0.5 * marchMult() * (1 - cmdLvl(S, 'arash') * 0.02)));
}
function gatherRate() { return (12 + armyCount() * 0.6) * (1 + cmdLvl(S, 'cyrus') * 0.04); }
function carryCap() { return 300 + armyCount() * 25; }

function startGather(nodeId) {
  if (S.march) { toast('⏳ یک گروه در حال حرکت است', 'bad'); sfx.bad(); return; }
  if (armyCount() < 1) { toast('🚫 سرباز لازم است', 'bad'); return; }
  const n = MAP.nodes.find((x) => x.id === nodeId);
  if (!n || n.amount <= 0) return;
  const t = marchTime(n.x, n.y);
  S.march = { kind: 'gather', id: nodeId, x: n.x, y: n.y, phase: 'go', t: 0, goT: t, workT: 0, gathered: 0, label: 'جمع‌آوری ' + RN[n.t] };
  addEvent('🧺', 'گروه جمع‌آوری به سمت منبع ' + RN[n.t] + ' حرکت کرد', '');
  sfx.build(); save(); render();
}
function startHunt(campId, isAi) {
  if (S.march) { toast('⏳ یک گروه در حال حرکت است', 'bad'); sfx.bad(); return; }
  if (armyCount() < 1) { toast('🚫 سرباز لازم است', 'bad'); return; }
  const list = isAi ? MAP.ais : MAP.camps;
  const c = list.find((x) => x.id === campId);
  if (!c) return;
  const t = marchTime(c.x, c.y);
  S.march = { kind: isAi ? 'pve' : 'hunt', id: campId, x: c.x, y: c.y, phase: 'go', t: 0, goT: t, ai: !!isAi, label: 'حمله' };
  addEvent('⚔️', 'ارتش به سمت «' + (c.n || 'اردوی هیولاها') + '» حرکت کرد', '');
  sfx.build(); save(); render();
}
function startPvp(pid, x, y, name) {
  if (S.march) { toast('⏳ یک گروه در حال حرکت است', 'bad'); return; }
  if (armyCount() < 1) { toast('🚫 سرباز لازم است', 'bad'); return; }
  const t = marchTime(x, y);
  S.march = { kind: 'pvp', id: pid, x: x, y: y, phase: 'go', t: 0, goT: t, label: 'حمله به ' + name };
  addEvent('⚔️', 'ارتش به سمت قلعه‌ی «' + name + '» حرکت کرد', '');
  sfx.build(); save(); render();
}

function tickMarch(dt) {
  const m = S.march;
  if (!m) return;
  m.t += dt;
  if (m.phase === 'go' && m.t >= m.goT) {
    m.phase = 'work'; m.t = 0;
    if (m.kind !== 'gather') { resolveCombatAt(m); return; }
  }
  if (m.phase === 'work' && m.kind === 'gather') {
    const node = MAP.nodes.find((n) => n.id === m.id);
    if (!node) { S.march = null; return; }
    const space = carryCap() - m.gathered;
    const take = Math.min(node.amount, space, gatherRate() * dt);
    if (take > 0) { node.amount -= take; m.gathered += take; }
    if (node.amount <= 0 || space <= 0.5) { m.phase = 'back'; m.t = 0; }
  }
  if (m.phase === 'back' && m.t >= m.goT) {
    if (m.kind === 'gather') {
      const node = MAP.nodes.find((n) => n.id === m.id);
      const tt = node ? node.t : 'food';
      const g = {}; g[tt] = Math.floor(m.gathered);
      gain(g);
      S.stats.gathers = (S.stats.gathers || 0) + 1;
      if (!(S.explored || []).some((e) => e[0] === m.x && e[1] === m.y)) { (S.explored = S.explored || []).push([m.x, m.y]); }
      toast('🧺 ' + fmt(m.gathered) + ' ' + RN[tt] + ' به انبار رسید', 'good');
      addEvent('🧺', 'کاروان با ' + fmt(m.gathered) + ' ' + RN[tt] + ' بازگشت', 'win');
      sfx.coin(); checkAch();
    }
    S.march = null;
    save(); render();
  }
}
function resolveCombatAt(m) {
  let foe = null, isPlayer = false;
  if (m.kind === 'hunt') foe = MAP.camps.find((c) => c.id === m.id);
  else if (m.kind === 'pve') foe = MAP.ais.find((c) => c.id === m.id);
  else if (m.kind === 'pvp') {
    const p = (NET.players || []).find((x) => x.id === m.id);
    if (p && p.army) { foe = { n: p.name, i: '🌐', lv: p.castle || 5, army: p.army }; isPlayer = true; }
  }
  if (!foe || !foe.army) { S.march = null; return; }
  const r = simulate(S.units, foe, false);
  const saved = applyMyLosses(r.losses);
  if (r.win) {
    S.stats.wins++;
    let rew = null;
    if (m.kind === 'hunt') {
      rew = { gold: Math.ceil(150 * foe.lv * raidMult()), food: Math.ceil(300 * foe.lv * raidMult()) };
      foe.dead = true;
      S.stats.hunts = (S.stats.hunts || 0) + 1;
    } else if (m.kind === 'pve') {
      rew = { gold: Math.ceil(200 * foe.lv * raidMult()), stone: Math.ceil(250 * foe.lv * raidMult()) };
    } else if (isPlayer) {
      rew = { gold: Math.ceil(r.fp * 0.15 * raidMult()), food: Math.ceil(r.fp * 0.2 * raidMult()) };
      if (NET.on && NET.token) netChat('world', '⚔️ ' + S.name + ' قلعه‌ی ' + foe.n + ' را غارت کرد!');
    }
    if (rew) gain(rew);
    S.stats.kills = (S.stats.kills || 0) + r.fLost;
    dropGear(foe.lv || 3);
    gainXp(Math.ceil(r.fp / 8) + 10);
    sfx.win();
    addEvent('🏆', 'پیروزی در نبرد «' + (foe.n || '') + '»', 'win');
    showBattle(foe, r, rew, saved);
    checkAch();
  } else {
    S.stats.losses++;
    gainXp(4);
    sfx.lose();
    addEvent('💀', 'شکست در «' + (foe.n || '') + '»', 'raid');
    showBattle(foe, r, null, saved);
  }
  S.march = { kind: 'back', id: m.id, x: m.x, y: m.y, phase: 'back', t: 0, goT: m.goT, label: 'بازگشت' };
  save(); render();
}

/* ==========================================================================
   نسخه‌ی ۲ — رندر نقشه‌ی جهان (Canvas + مه)
   ========================================================================== */
let mapAnim = null;
const MAPIMG = new Image();
try { MAPIMG.src = 'bg-map.jpg'; } catch (e) {}

function mapPos(x, y, w, h) { return [x / 100 * w, y / 100 * h]; }

function drawMap() {
  const cv = $('#mapCv');
  if (!cv || !MAP) return;
  const w = cv.width, h = cv.height;
  const ctx = cv.getContext('2d');
  ctx.clearRect(0, 0, w, h);
  if (MAPIMG.complete && MAPIMG.naturalWidth) ctx.drawImage(MAPIMG, 0, 0, w, h);
  else { const g = ctx.createLinearGradient(0, 0, 0, h); g.addColorStop(0, '#1c1430'); g.addColorStop(1, '#0d0a18'); ctx.fillStyle = g; ctx.fillRect(0, 0, w, h); }
  if (isNight()) { ctx.fillStyle = 'rgba(10,10,40,.38)'; ctx.fillRect(0, 0, w, h); }

  const [hx, hy] = mapPos(MAP.home.x, MAP.home.y, w, h);

  // گره‌های منبع
  for (const n of MAP.nodes) {
    if (n.amount <= 0) continue;
    if (!isRevealed(n.x, n.y)) continue;
    const [x, y] = mapPos(n.x, n.y, w, h);
    const ic = { food: '🌾', wood: '🪵', stone: '🪨', gold: '🪙' }[n.t];
    ctx.font = (w * 0.055) + 'px serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(ic, x, y);
  }
  // اردوهای هیولا
  for (const c of MAP.camps) {
    if (c.dead || !isRevealed(c.x, c.y)) continue;
    const [x, y] = mapPos(c.x, c.y, w, h);
    ctx.font = (w * 0.06) + 'px serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('👹', x, y);
    ctx.font = 'bold ' + (w * 0.028) + 'px sans-serif'; ctx.fillStyle = '#ff9a94';
    ctx.fillText(fa(c.lv), x, y + w * 0.045);
  }
  // قلعه‌های هوش‌مصنوعی
  for (const a of MAP.ais) {
    if (!isRevealed(a.x, a.y)) continue;
    const [x, y] = mapPos(a.x, a.y, w, h);
    ctx.font = (w * 0.06) + 'px serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('🏯', x, y);
  }
  // بازیکنان آنلاین
  if (NET.on) for (const p of NET.players) {
    if (!p.pos || p.id === NET.meId) continue;
    const [x, y] = mapPos(p.pos[0], p.pos[1], w, h);
    ctx.font = (w * 0.055) + 'px serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('🌐', x, y);
  }
  // قلعه‌ی خودی
  ctx.font = (w * 0.085) + 'px serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.shadowColor = 'rgba(224,177,60,.8)'; ctx.shadowBlur = 14;
  ctx.fillText('🏰', hx, hy);
  ctx.shadowBlur = 0;

  // ارتش در حال حرکت
  const m = S.march;
  if (m) {
    let px, py;
    const [tx, ty] = mapPos(m.x, m.y, w, h);
    if (m.phase === 'go') { const k = clamp(m.t / m.goT, 0, 1); px = hx + (tx - hx) * k; py = hy + (ty - hy) * k; }
    else if (m.phase === 'back') { const k = clamp(m.t / m.goT, 0, 1); px = tx + (hx - tx) * k; py = ty + (hy - ty) * k; }
    else { px = tx; py = ty; }
    ctx.font = (w * 0.05) + 'px serif';
    ctx.fillText('⚔️', px, py - w * 0.02);
  }

  // مه
  const fog = document.createElement('canvas');
  fog.width = w; fog.height = h;
  const fc = fog.getContext('2d');
  fc.fillStyle = 'rgba(6,4,14,.93)';
  fc.fillRect(0, 0, w, h);
  fc.globalCompositeOperation = 'destination-out';
  const rr = revealR() / 100 * w;
  let g2 = fc.createRadialGradient(hx, hy, rr * 0.55, hx, hy, rr);
  g2.addColorStop(0, 'rgba(0,0,0,1)'); g2.addColorStop(1, 'rgba(0,0,0,0)');
  fc.fillStyle = g2; fc.beginPath(); fc.arc(hx, hy, rr, 0, 7); fc.fill();
  for (const e of (S.explored || [])) {
    const [ex, ey] = mapPos(e[0], e[1], w, h);
    const er = 12 / 100 * w;
    const g3 = fc.createRadialGradient(ex, ey, er * 0.4, ex, ey, er);
    g3.addColorStop(0, 'rgba(0,0,0,.95)'); g3.addColorStop(1, 'rgba(0,0,0,0)');
    fc.fillStyle = g3; fc.beginPath(); fc.arc(ex, ey, er, 0, 7); fc.fill();
  }
  ctx.drawImage(fog, 0, 0);
}

function mapLoop() {
  if (VIEW === 'camp') drawMap();
  mapAnim = requestAnimationFrame(mapLoop);
}
function stopMapLoop() { if (mapAnim) cancelAnimationFrame(mapAnim); mapAnim = null; }

function onMapTap(e) {
  const cv = $('#mapCv');
  const r = cv.getBoundingClientRect();
  const x = (e.clientX - r.left) / r.width * 100;
  const y = (e.clientY - r.top) / r.height * 100;
  let best = null, bd = 7;
  const consider = (obj, kind) => {
    if (!isRevealed(obj.x, obj.y)) return;
    const d = Math.hypot(obj.x - x, obj.y - y);
    if (d < bd) { bd = d; best = { obj, kind }; }
  };
  for (const n of MAP.nodes) if (n.amount > 0) consider(n, 'node');
  for (const c of MAP.camps) if (!c.dead) consider(c, 'camp');
  for (const a of MAP.ais) consider(a, 'ai');
  if (NET.on) for (const p of NET.players) { if (p.pos && p.id !== NET.meId) consider({ x: p.pos[0], y: p.pos[1], p }, 'player'); }
  if (!best) return;
  sfx.tap();
  if (best.kind === 'node') nodeModal(best.obj);
  else if (best.kind === 'camp') campModal(best.obj, false);
  else if (best.kind === 'ai') campModal(best.obj, true);
  else playerModal(best.obj.p);
}

    '<div class="pw theirs"><span>⚔️ ' + fmt(fp) + '</span><div class="bar"><i style="width:' + Math.round(clamp(fp / (mp + fp) * 100, 3, 97)) + '%"></i></div></div>' +

    statRow('⏱️ زمان حرکت', fmtT(marchTime(c.x, c.y))) +

}
function playerModal(p) {

/* ---------- انیمیشن نبرد ---------- */
function battleAnim(canvas, win) {
  const ctx = canvas.getContext('2d');
  const w = canvas.width, h = canvas.height;
  const my = [], fo = [];
  for (let i = 0; i < 14; i++) { my.push({ x: w * 0.12 + Math.random() * w * 0.1, y: h * 0.25 + Math.random() * h * 0.5, vx: 1.4 + Math.random() }); fo.push({ x: w * 0.78 + Math.random() * w * 0.1, y: h * 0.25 + Math.random() * h * 0.5, vx: -(1.4 + Math.random()) }); }
  const parts = [];
  let t0 = performance.now();
  function fr(t) {
    const dt = (t - t0) / 16; t0 = t;
    ctx.fillStyle = '#0a0714'; ctx.fillRect(0, 0, w, h);
    const g = ctx.createLinearGradient(0, h * 0.7, 0, h); g.addColorStop(0, 'rgba(122,58,237,.12)'); g.addColorStop(1, 'rgba(0,0,0,.4)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
    const clash = w / 2;
    for (const s of my) { s.x += s.vx * dt; if (s.x > clash - 6 + Math.random() * 8) { if (Math.random() < 0.08) parts.push({ x: s.x, y: s.y, l: 12 }); s.x -= 3; } }
    for (const s of fo) { s.x += s.vx * dt; if (s.x < clash + 6 - Math.random() * 8) { if (Math.random() < 0.08) parts.push({ x: s.x, y: s.y, l: 12 }); s.x += 3; } }
    ctx.fillStyle = '#f2c95c'; for (const s of my) ctx.fillRect(s.x, s.y, 4, 4);
    ctx.fillStyle = '#e0705f'; for (const s of fo) ctx.fillRect(s.x, s.y, 4, 4);
    for (let i = parts.length - 1; i >= 0; i--) { const p = parts[i]; p.l -= dt; if (p.l <= 0) { parts.splice(i, 1); continue; } ctx.fillStyle = 'rgba(255,220,120,' + (p.l / 12) + ')'; ctx.fillRect(p.x + (Math.random() - .5) * 6, p.y + (Math.random() - .5) * 6, 3, 3); }
    if (win === false) { ctx.fillStyle = 'rgba(180,40,30,.08)'; ctx.fillRect(0, 0, w, h); }
    requestAnimationFrame(fr);
  }
  requestAnimationFrame(fr);
}

/* ==========================================================================
   ماژول آنلاین (NET)
   ========================================================================== */
const NET = { on: false, token: null, meId: null, me: null, lb: [], players: [], als: [], msgs: [], amsgs: [], lastTs: 0 };
async function netPing() {
  if (location.protocol === 'file:') { NET.on = false; return; }
  try {
    const r = await fetch('api/ping'); const j = await r.json();
    NET.on = !!j.ok;
    if (NET.on) {
      NET.token = localStorage.getItem('tep_token');
      if (NET.token) { await netMe(); }
      netPoll();
    }
  } catch (e) { NET.on = false; }
  if (VIEW === 'net') render();
}
async function netMe() {
  try {
    const r = await fetch('api/leaderboard'); const j = await r.json();
    if (j.ok) {
      NET.lb = j.list;
      const me = j.list.find((p) => p.id === NET.meId) || null;
      if (!NET.meId) {
        // توکن داریم ولی id نداریم: از سرور بخواه
        const l = await fetch('api/load?token=' + encodeURIComponent(NET.token)); const lj = await l.json();
        if (lj.ok) { NET.meId = lj.player.id; NET.me = lj.player; if (lj.save && lj.save.lvl) { /* ذخیره ابری موجود */ NET.cloud = lj.save; } }
        else { NET.token = null; localStorage.removeItem('tep_token'); }
      }
    }
  } catch (e) {}
}
async function netRegister(name) {
  try {
    const r = await fetch('api/register', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name }) });
    const j = await r.json();
    if (j.ok) {
      NET.token = j.token; NET.meId = j.player.id; NET.me = j.player;

};

};

function chromaKey(img) {
  const c = document.createElement('canvas');
  c.width = img.naturalWidth || 512; c.height = img.naturalHeight || 512;
  const x = c.getContext('2d');
  x.drawImage(img, 0, 0, c.width, c.height);
  let d;
  try { d = x.getImageData(0, 0, c.width, c.height); } catch (e) { return null; }
  const p = d.data;
  for (let i = 0; i < p.length; i += 4) {
    const r = p[i], g = p[i + 1], b = p[i + 2];
    if (g > 110 && g > r + 25 && g > b + 25) p[i + 3] = 0;
    else if (g > 90 && g > r + 12 && g > b + 12) p[i + 3] = 90;
  }
  x.putImageData(d, 0, 0);
  return c.toDataURL();
}
function loadSprite(key) {
  return new Promise((ok) => {
    const im = new Image();
    const to = setTimeout(() => ok(null), 4000);
    im.onload = () => { clearTimeout(to); ok(chromaKey(im)); };
    im.onerror = () => { clearTimeout(to); ok(null); };
    im.src = IMG[key];
  });
}

/* ---------- لودینگ ۰ تا ۱۰ ---------- */
async function v3Loading() {
  const scr = $('#loadScreen');
  if (!scr) return;
  const bar = $('#loadBar'), pct = $('#loadPct'), tip = $('#loadTip');
  const tips = ['بیدار کردن اژدها…', 'تیز کردن شمشیرها…', 'شمردن گندم انبارها…', 'کاوش در مه نقشه…', 'صیقل دادن تاج پادشاهی…', 'گرم کردن طبل‌های جنگ…'];
  const assets = Object.values(IMG).concat(['icon-512.png']);
  let loaded = 0, total = 0, done = 0;
  const t0 = Date.now();
  const jobs = assets.map((a) => fetch(a).then(async (r) => {
    const len = +(r.headers.get('content-length') || 0);
    total += len;
    if (r.body && len) {
      const rd = r.body.getReader();
      for (;;) { const ch = await rd.read(); if (ch.done) break; loaded += ch.value.length; }
    }
  }).catch(() => {}).then(() => { done++; }));
  const sprJobs = Object.keys(IMG).filter((k) => IMG[k].endsWith('.png')).map(async (k) => { SPRITES[k] = await loadSprite(k); });
  let shown = 0;
  const iv = setInterval(() => {
    const bp = total ? (loaded / total) * 82 : (done / assets.length) * 82;
    const sp = (done / assets.length) * 14;
    shown = Math.max(shown, Math.min(96, Math.round(bp + sp)));
    bar.style.width = shown + '%'; pct.textContent = fa(shown) + '٪';
    tip.textContent = '⬇ ' + tips[Math.floor((Date.now() - t0) / 800) % tips.length];
  }, 90);
  await Promise.all(jobs);
  await Promise.all(sprJobs);
  clearInterval(iv);
  const wait = Math.max(0, 3200 - (Date.now() - t0));
  await new Promise((r) => setTimeout(r, wait));
  await new Promise((ok) => {
    let v = shown;
    const iv2 = setInterval(() => {
      v += 1; bar.style.width = Math.min(100, v) + '%'; pct.textContent = fa(Math.min(100, v)) + '٪';
      if (v >= 100) { clearInterval(iv2); ok(); }
    }, 24);
  });
  tip.textContent = '⚔️ آماده‌ی نبرد!';
  await new Promise((r) => setTimeout(r, 400));
  scr.style.transition = 'opacity .6s'; scr.style.opacity = '0';
  setTimeout(() => scr.remove(), 700);
}

    e.id = 'marchDot';

    e.innerHTML = '<span>⚔️</span>';
    sc.appendChild(e);
  }
  v.appendChild(sc);
  animateMarchDot();

  if (S.march) {
    const m = S.march;
    const bar = el('div', 'marchbar');
    bar.innerHTML = '<span>🐎 ' + m.label + '</span><div class="pbar mil"><i style="width:' + clamp(m.t / m.goT * 100, 0, 100) + '%"></i></div><span>' + fmtT(Math.max(0, m.goT - m.t)) + '</span>';
    v.appendChild(bar);
  }

  v.appendChild(el('div', 'secttl', '🎁 ماموریت‌ها'));
  let claimed = 0;
  for (const q of QUESTS) {
    const done = !!S.q[q.id]; const okk = !done && q.c(S); if (done) claimed++;
    const d = el('div', 'quest' + (done ? ' done' : ''));
    d.innerHTML = '<span class="qi">' + (done ? '✅' : q.i) + '</span><div class="qt"><b>' + q.n + '</b><small>' + q.d + '</small></div>' + (okk ? '<button class="qbtn" data-act="quest" data-id="' + q.id + '">دریافت</button>' : '');
    v.appendChild(d);
  }

  v.appendChild(el('div', 'secttl', '🗺️ کمپین فتح پادشاهی‌ها'));
  const mp = myPower();
  FOES.forEach((f, i) => {
    const fp = foePower(f);
    const ratio = mp / Math.max(1, fp);
    const cls = ratio > 1.4 ? 'good' : ratio > 0.85 ? 'mid' : 'bad';
    const n = el('div', 'foe' + (S.beaten[i] ? ' beaten' : ''));
    n.innerHTML = '<div class="fhead"><div class="uic">' + f.i + '</div><div style="flex:1"><b>' + f.n + '</b><small>سطح ' + fa(f.lv) + (S.beaten[i] ? ' · فتح شده ✓' : '') + '</small></div><span class="odds ' + cls + '">' + (ratio > 1.4 ? 'آسان' : ratio > 0.85 ? 'نزدیک' : 'خطر') + '</span></div>' +
      '<button class="btn red" data-act="attack" data-i="' + i + '"' + (armyCount() < 1 ? ' disabled' : '') + '>⚔️ حمله</button>';
    v.appendChild(n);
  });

  setTimeout(() => { const cv = $('#mapCv'); if (cv) drawFogOnly(cv); }, 0);
}
function drawFogOnly(cv) {
  const w = cv.width, h = cv.height, ctx = cv.getContext('2d');
  ctx.clearRect(0, 0, w, h);
  ctx.fillStyle = 'rgba(6,4,14,.93)'; ctx.fillRect(0, 0, w, h);
  ctx.globalCompositeOperation = 'destination-out';
  const [hx, hy] = [MAP.home.x / 100 * w, MAP.home.y / 100 * h];
  const rr = revealR() / 100 * w;
  const g2 = ctx.createRadialGradient(hx, hy, rr * 0.5, hx, hy, rr);
  g2.addColorStop(0, 'rgba(0,0,0,1)'); g2.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g2; ctx.beginPath(); ctx.arc(hx, hy, rr, 0, 7); ctx.fill();
  for (const e of (S.explored || [])) {
    const ex = e[0] / 100 * w, ey = e[1] / 100 * h, er = 12 / 100 * w;
    const g3 = ctx.createRadialGradient(ex, ey, er * 0.4, ex, ey, er);
    g3.addColorStop(0, 'rgba(0,0,0,.95)'); g3.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g3; ctx.beginPath(); ctx.arc(ex, ey, er, 0, 7); ctx.fill();
  }
}
function animateMarchDot() {
  const d = $('#marchDot');
  if (!d || !S.march || !MAP) return;
  const m = S.march;
  const [hx, hy] = [MAP.home.x, MAP.home.y];
  let px, py;
  if (m.phase === 'go') { const k = clamp(m.t / m.goT, 0, 1); px = hx + (m.x - hx) * k; py = hy + (m.y - hy) * k; }
  else if (m.phase === 'back') { const k = clamp(m.t / m.goT, 0, 1); px = m.x + (hx - m.x) * k; py = m.y + (hy - m.y) * k; }
  else { px = m.x; py = m.y; }
  d.style.left = px + '%'; d.style.top = py + '%';
}

const MUSIC = { iv: null };
function ensureAC() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (AC && AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(ac, f, dur, type, vol) {
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.value = f;
  o.connect(g); g.connect(ac.destination);
  const t = ac.currentTime;
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(vol, t + 0.03);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.start(t); o.stop(t + dur + 0.05);
}
function pluck(ac, f) {
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = 'triangle'; o.frequency.value = f;
  const fl = ac.createBiquadFilter(); fl.type = 'lowpass'; fl.frequency.value = 1800;
  o.connect(fl); fl.connect(g); g.connect(ac.destination);
  const t = ac.currentTime;
  g.gain.setValueAtTime(0.06, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.5);
  o.start(t); o.stop(t + 0.55);
}
function darbuka(ac, vol) {
  const len = ac.sampleRate * 0.12, buf = ac.createBuffer(1, len, ac.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3);
  const src = ac.createBufferSource(); src.buffer = buf;
  const fl = ac.createBiquadFilter(); fl.type = 'bandpass'; fl.frequency.value = 220;
  const g = ac.createGain(); g.gain.value = vol;
  src.connect(fl); fl.connect(g); g.connect(ac.destination);
  src.start();
}
function musicStart() {
  const ac = ensureAC(); if (!ac || MUSIC.iv) return;
  const D2 = 73.42;
  const scale = [146.83, 174.61, 196, 220, 261.63, 293.66, 349.23];
  let step = 0;
  MUSIC.iv = setInterval(() => {
    if (!S.music) return;
    if (step % 32 === 0) { tone(ac, D2, 7.4, 'sawtooth', 0.03); tone(ac, D2 * 1.5, 7.4, 'sawtooth', 0.02); tone(ac, D2 * 4, 3.7, 'triangle', 0.028); }
    if (step % 8 === 4) tone(ac, 49, 1.3, 'sine', 0.17);
    if (step % 4 === 0) darbuka(ac, step % 8 === 0 ? 0.55 : 0.3);
    if (step % 2 === 0 && Math.random() < 0.45) pluck(ac, scale[Math.floor(Math.random() * scale.length)] * (Math.random() < 0.25 ? 2 : 1));
    if (step % 16 === 12) { tone(ac, 220, 2.6, 'sawtooth', 0.045); tone(ac, 233.08, 2.6, 'sawtooth', 0.038); }
    if (step % 64 === 40) { tone(ac, 98, 4.8, 'sawtooth', 0.05); tone(ac, 146.83, 4.8, 'sawtooth', 0.04); }
    step++;
  }, 210);
}
function musicStop() { if (MUSIC.iv) { clearInterval(MUSIC.iv); MUSIC.iv = null; } }

const GEAR_SLOTS = { weapon: ['⚔️', 'حمله'], helmet: ['🪖', 'دفاع'], armor: ['🥋', 'دفاع'], boots: ['🥾', 'سرعت'], ring: ['💍', 'حمله'], cape: ['🧣', 'جان'] };
function dropGear(lv) {
